name: Manual Release (Temporary)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.16.0)"
        required: true
        type: string

permissions: write-all

defaults:
  run:
    shell: bash

jobs:
  release:
    name: "Release ${{ matrix.charm-kind }} charm"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        charm-kind: [k8s, machine]

    steps:
      - uses: actions/checkout@v6

      - name: Install LXD
        uses: canonical/setup-lxd@main

      - name: Build dashboard
        working-directory: charms/${{ matrix.charm-kind }}-charm
        id: build
        run: |
          OUTPUT=$(./build.sh)

          if [ '${{ matrix.charm-kind }}' = 'k8s' ]; then
              echo "$OUTPUT" | grep '^id=' >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ matrix.charm-kind == 'k8s' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload docker image
        if: ${{ matrix.charm-kind == 'k8s' }}
        run: |
          FINAL_TAG='ghcr.io/canonical/juju-dashboard:${{ inputs.version }}'
          docker image tag '${{ steps.build.outputs.id }}' "$FINAL_TAG"
          docker image push "$FINAL_TAG"

      - name: Get charm path
        id: post-build
        run: |
          CHARM_DIR='charms/${{ matrix.charm-kind }}-charm'
          BUILT_CHARM_PATHS=$(ls -1 $CHARM_DIR/*.charm | xargs -L1 basename | paste -sd ',' -)
          echo "charm-dir=$CHARM_DIR" | tee -a "$GITHUB_OUTPUT"
          echo "built-charm-path=$BUILT_CHARM_PATHS" | tee -a "$GITHUB_OUTPUT"

      - name: Save charm artifact
        uses: actions/upload-artifact@v7
        with:
          name: juju-dashboard-${{ matrix.charm-kind }}
          path: ${{ steps.post-build.outputs.charm-dir }}/*.charm

      - name: Create new tracks, if required
        run: |
          track='0.16'
          charm_name="$(yq '.name' '${{ steps.post-build.outputs.charm-dir }}/charmcraft.yaml')"

          authorization_header="Macaroon $(echo '${{ secrets.CHARMHUB_TOKEN }}' | base64 -d | jq -r .v)"

          jq_filter=".metadata.tracks[].name | select(. == \"$track\")"

          matching_track="$(curl -H "Authorization: $authorization_header" -H 'Content-type: application/json' "https://api.charmhub.io/v1/charm/$charm_name" | jq -r "$jq_filter")"

          if [ "$matching_track" = '' ]; then
            echo "Creating '$track' track for '$charm_name'"
            CHARMCRAFT_AUTH='${{ secrets.CHARMHUB_TOKEN }}' charmcraft create-track --name="$charm_name" --track="$track"
          else
            echo "'$track' track for '$charm_name' already created. Continuing..."
          fi

      - name: Upload charm to beta
        uses: canonical/charming-actions/upload-charm@main
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          channel: "0.16/beta"
          charm-path: "${{ steps.post-build.outputs.charm-dir }}"
          built-charm-path: "${{ steps.post-build.outputs.built-charm-path }}"
          upload-image: true
          pull-image: false
          charmcraft-channel: latest/stable
          github-tag: false

      - name: Promote charm to candidate
        uses: andogq/charming-actions/promote-charm@fix/promote-charm-branch
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          origin-channel: "0.16/beta"
          destination-channel: "0.16/candidate"
          charm-path: ${{ steps.post-build.outputs.charm-dir }}
          charmcraft-channel: latest/stable

      - name: Promote charm to stable
        uses: andogq/charming-actions/promote-charm@fix/promote-charm-branch
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          origin-channel: "0.16/candidate"
          destination-channel: "0.16/stable"
          charm-path: ${{ steps.post-build.outputs.charm-dir }}
          charmcraft-channel: latest/stable

      - name: Send notification
        uses: ./.github/actions/send-notification
        with:
          webhook-url: "${{ secrets.WEBBOT_URL }}"
          message: |
            Successfully published Juju Dashboard ${{ matrix.charm-kind }} charm `${{ inputs.version }}` to `0.16/stable`
      - name: Send notification on failure
        if: failure()
        uses: ./.github/actions/send-notification
        with:
          webhook-url: "${{ secrets.WEBBOT_URL }}"

  post-release:
    name: "Create tags and GitHub release"
    runs-on: ubuntu-24.04
    needs: [release]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Tag commits
        id: tags
        run: |
          git tag -f "track/0.16/beta"
          git tag -f "track/0.16/candidate"
          git tag -f "track/0.16/stable"
          git tag -f "v${{ inputs.version }}"
          git push --tags --force
          echo "version-tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download k8s charm artifact
        uses: actions/download-artifact@v8
        with:
          name: juju-dashboard-k8s
          path: release-artifacts

      - name: Download machine charm artifact
        uses: actions/download-artifact@v8
        with:
          name: juju-dashboard-machine
          path: release-artifacts

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          name: "Juju Dashboard ${{ inputs.version }}"
          tag: "v${{ inputs.version }}"
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: release-artifacts/**/*.charm
          body: |
            Published `v${{ inputs.version }}` to Charmhub on `0.16/stable` channel.
